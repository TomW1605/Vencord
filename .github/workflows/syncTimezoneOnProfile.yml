name: Merge Hazrtine/TimezoneOnProfile into main
on:
    schedule:
        - cron: "0 */6 * * *"
    workflow_dispatch:

permissions:
    contents: write
    actions: write # needed to dispatch build.yml

concurrency:
    group: sync-main
    cancel-in-progress: false

env:
    SOURCE_REPO: 'Hazrtine/Vencord'
    SOURCE_BRANCH: 'TimezoneOnProfile'

jobs:
    # cheap check via the compare API so we don't checkout/fetch when there's nothing new
    check:
        runs-on: ubuntu-latest
        outputs:
            ahead_by: ${{ steps.compare.outputs.ahead_by }}
        steps:
            - name: Check for new commits
              id: compare
              run: |
                  ahead_by=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...${SOURCE_REPO%%/*}:$SOURCE_BRANCH" --jq .ahead_by)
                  echo "$SOURCE_REPO/$SOURCE_BRANCH has $ahead_by commit(s) not in main"
                  echo "ahead_by=$ahead_by" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    merge:
        needs: check
        if: needs.check.outputs.ahead_by != '0'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Fetch source branch
              run: |
                  git remote add source "https://github.com/$SOURCE_REPO.git"
                  git fetch source "$SOURCE_BRANCH"

            - name: Merge
              id: merge
              run: |
                  if git merge-base --is-ancestor "source/$SOURCE_BRANCH" HEAD; then
                      echo "main already contains $SOURCE_REPO/$SOURCE_BRANCH, nothing to do"
                      exit 0
                  fi

                  git merge --no-edit -m "Merge remote-tracking branch '$SOURCE_REPO/$SOURCE_BRANCH'" "source/$SOURCE_BRANCH" || {
                      echo "::error::Merge conflict merging $SOURCE_REPO/$SOURCE_BRANCH into main, resolve it manually"
                      git merge --abort
                      exit 1
                  }

                  git push origin main
                  echo "merged=true" >> "$GITHUB_OUTPUT"

            # pushes made with GITHUB_TOKEN don't trigger other workflows, so kick off the build manually
            - name: Trigger build
              if: steps.merge.outputs.merged == 'true'
              run: gh workflow run build.yml --ref main
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
